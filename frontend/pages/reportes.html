<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <title>Reportes | Bolt & Hammer</title>
</head>
<body data-page="reportes">
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <main class="main-content">
      <div id="topbar"></div>
      <div class="content-area">
        <div id="pageAlert"></div>
        
<div class="row g-3 mb-4">
  <div class="col-md-6 col-xl-2"><div class="card"><div class="card-body"><div class="small-muted">Ingresos</div><div id="reportIncome" class="h4 fw-bold mb-0">S/ 0.00</div></div></div></div>
  <div class="col-md-6 col-xl-2"><div class="card"><div class="card-body"><div class="small-muted">Costo estimado</div><div id="reportCost" class="h4 fw-bold mb-0">S/ 0.00</div></div></div></div>
  <div class="col-md-6 col-xl-2"><div class="card"><div class="card-body"><div class="small-muted">Utilidad estimada</div><div id="reportProfit" class="h4 fw-bold mb-0">S/ 0.00</div></div></div></div>
  <div class="col-md-6 col-xl-2"><div class="card"><div class="card-body"><div class="small-muted">Valor stock</div><div id="reportStockValue" class="h4 fw-bold mb-0">S/ 0.00</div></div></div></div>
  <div class="col-md-6 col-xl-2"><div class="card"><div class="card-body"><div class="small-muted">Ventas</div><div id="reportSalesCount" class="h4 fw-bold mb-0">0</div></div></div></div>
  <div class="col-md-6 col-xl-2"><div class="card"><div class="card-body"><div class="small-muted">Productos</div><div id="reportProductCount" class="h4 fw-bold mb-0">0</div></div></div></div>
</div>
<div class="row g-3">
  <div class="col-lg-4"><div class="card"><div class="card-body"><h5 class="fw-bold mb-3">Productos mas vendidos</h5><table class="table align-middle"><thead><tr><th>Producto</th><th>Cantidad</th></tr></thead><tbody id="reportTopBody"></tbody></table></div></div></div>
  <div class="col-lg-8"><div class="card"><div class="card-body"><h5 class="fw-bold mb-3">Stock bajo</h5><table class="table align-middle"><thead><tr><th>Codigo</th><th>Producto</th><th>Categoria</th><th>Stock</th><th>Minimo</th></tr></thead><tbody id="reportLowBody"></tbody></table></div></div></div>
  <div class="col-12"><div class="card"><div class="card-body"><h5 class="fw-bold mb-3">Detalle de ventas</h5><table class="table align-middle"><thead><tr><th>Fecha</th><th>Cliente</th><th>Vendedor</th><th>Pago</th><th>Total</th></tr></thead><tbody id="reportSalesBody"></tbody></table></div></div></div>
</div>

      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/apiClient.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
