<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <title>Productos | Bolt & Hammer</title>
</head>
<body data-page="productos">
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <main class="main-content">
      <div id="topbar"></div>
      <div class="content-area">
        <div id="pageAlert"></div>
        
<div id="productRoleNotice" class="alert alert-info d-none">Estas con rol vendedor: puedes consultar productos y stock, pero no registrar, editar ni eliminar productos.</div>
<div class="row g-3">
  <div class="col-lg-4" id="adminProductPanel">
    <div class="card"><div class="card-body">
      <h5 id="productFormTitle" class="fw-bold mb-3">Registrar producto</h5><div id="productAlert"></div>
      <form id="productForm" class="row g-3">
        <input type="hidden" id="productId">
        <div class="col-12"><label class="form-label">Codigo</label><input id="code" class="form-control" required></div>
        <div class="col-12"><label class="form-label">Nombre</label><input id="name" class="form-control" required></div>
        <div class="col-12"><label class="form-label">Categoria</label><select id="categoryId" class="form-select" required></select></div>
        <div class="col-12"><label class="form-label">Proveedor</label><select id="supplierId" class="form-select"></select></div>
        <div class="col-6"><label class="form-label">Stock</label><input id="stock" type="number" min="0" class="form-control" required></div>
        <div class="col-6"><label class="form-label">Stock minimo</label><input id="minStock" type="number" min="0" class="form-control" required></div>
        <div class="col-6"><label class="form-label">Precio compra</label><input id="buyPrice" type="number" min="0" step="0.01" class="form-control" required></div>
        <div class="col-6"><label class="form-label">Precio venta</label><input id="salePrice" type="number" min="0" step="0.01" class="form-control" required></div>
        <div class="col-12 d-flex gap-2"><button class="btn btn-primary">Guardar</button><button type="button" id="btnCancelProduct" class="btn btn-outline-secondary">Cancelar</button></div>
      </form>
    </div></div>
  </div>
  <div class="col-lg-8"><div class="card"><div class="card-body"><div class="d-flex justify-content-between flex-wrap gap-2 mb-3"><h5 class="fw-bold mb-0">Listado de productos</h5><input id="searchProduct" class="form-control" style="max-width:280px" placeholder="Buscar producto..."></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Codigo</th><th>Producto</th><th>Categoria</th><th>Proveedor</th><th>Stock</th><th>Precio</th><th class="text-end">Acciones</th></tr></thead><tbody id="productTableBody"></tbody></table></div></div></div></div>
</div>

      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/apiClient.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
