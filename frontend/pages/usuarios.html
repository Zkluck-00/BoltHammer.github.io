<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <title>Usuarios | Bolt & Hammer</title>
</head>
<body data-page="usuarios">
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <main class="main-content">
      <div id="topbar"></div>
      <div class="content-area">
        <div id="pageAlert"></div>
        
<div class="row g-3">
  <div class="col-lg-4"><div class="card"><div class="card-body"><h5 id="userFormTitle" class="fw-bold mb-3">Registrar usuario</h5><div id="userAlert"></div><form id="userForm" class="row g-3"><input type="hidden" id="userId"><div class="col-12"><label class="form-label">Nombre</label><input id="userName" class="form-control" required></div><div class="col-12"><label class="form-label">Usuario</label><input id="userUsername" class="form-control" required></div><div class="col-12"><label class="form-label">Contraseña</label><input id="userPassword" type="password" class="form-control" placeholder="Obligatoria al crear; opcional al editar"></div><div class="col-12"><label class="form-label">Rol</label><select id="userRole" class="form-select"><option value="ADMIN">Administrador</option><option value="VENDEDOR">Vendedor</option><option value="ALMACENERO">Almacenero</option></select></div><div class="col-12"><div class="form-check"><input id="userActive" class="form-check-input" type="checkbox" checked><label class="form-check-label">Usuario activo</label></div></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary">Guardar</button><button type="button" id="btnCancelUser" class="btn btn-outline-secondary">Cancelar</button></div></form></div></div></div>
  <div class="col-lg-8"><div class="card"><div class="card-body"><h5 class="fw-bold mb-3">Listado de usuarios</h5><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead><tbody id="userTableBody"></tbody></table></div></div></div></div>
</div>

      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/apiClient.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
