<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <title>Proveedores | Bolt & Hammer</title>
</head>
<body data-page="proveedores">
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <main class="main-content">
      <div id="topbar"></div>
      <div class="content-area">
        <div id="pageAlert"></div>
        
<div class="row g-3">
  <div class="col-lg-4"><div class="card"><div class="card-body"><h5 id="supplierFormTitle" class="fw-bold mb-3">Registrar proveedor</h5><div id="supplierAlert"></div><form id="supplierForm" class="row g-3"><input type="hidden" id="supplierId"><div class="col-12"><label class="form-label">Empresa</label><input id="company" class="form-control" required></div><div class="col-12"><label class="form-label">RUC</label><input id="ruc" class="form-control" required></div><div class="col-12"><label class="form-label">Telefono</label><input id="phone" class="form-control"></div><div class="col-12"><label class="form-label">Correo</label><input id="email" class="form-control"></div><div class="col-12"><label class="form-label">Direccion</label><input id="address" class="form-control"></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary">Guardar</button><button type="button" id="btnCancelSupplier" class="btn btn-outline-secondary">Cancelar</button></div></form></div></div></div>
  <div class="col-lg-8"><div class="card"><div class="card-body"><div class="d-flex justify-content-between flex-wrap gap-2 mb-3"><h5 class="fw-bold mb-0">Listado de proveedores</h5><input id="searchSupplier" class="form-control" style="max-width:280px" placeholder="Buscar proveedor..."></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Empresa</th><th>RUC</th><th>Telefono</th><th>Correo</th><th class="text-end">Acciones</th></tr></thead><tbody id="supplierTableBody"></tbody></table></div></div></div></div>
</div>

      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/apiClient.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
