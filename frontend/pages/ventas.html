<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <title>Ventas | Bolt & Hammer</title>
</head>
<body data-page="ventas">
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <main class="main-content">
      <div id="topbar"></div>
      <div class="content-area">
        <div id="pageAlert"></div>
        
<div class="row g-3">
  <div class="col-lg-4"><div class="card"><div class="card-body"><h5 class="fw-bold mb-3">Registrar venta</h5><div id="saleAlert"></div><div class="row g-3"><div class="col-12"><label class="form-label">Cliente</label><select id="saleClient" class="form-select"></select></div><div class="col-12"><label class="form-label">Producto</label><select id="saleProduct" class="form-select"></select></div><div class="col-6"><label class="form-label">Cantidad</label><input id="saleQty" type="number" min="1" value="1" class="form-control"></div><div class="col-6"><label class="form-label">Pago</label><select id="salePayment" class="form-select"><option>Efectivo</option><option>Tarjeta</option><option>Yape/Plin</option><option>Transferencia</option></select></div><div class="col-12"><button type="button" id="btnAddToCart" class="btn btn-outline-primary w-100">Agregar producto</button></div></div></div></div></div>
  <div class="col-lg-8"><div class="card mb-3"><div class="card-body"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="fw-bold mb-0">Detalle de venta</h5><div class="h5 mb-0">Total: <span id="saleTotal">S/ 0.00</span></div></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Codigo</th><th>Producto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th><th class="text-end">Acciones</th></tr></thead><tbody id="cartBody"></tbody></table></div><button id="btnCompleteSale" class="btn btn-success">Completar venta</button></div></div><div class="card"><div class="card-body"><h5 class="fw-bold mb-3">Ventas registradas</h5><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Fecha</th><th>Cliente</th><th>Vendedor</th><th>Pago</th><th>Items</th><th>Total</th></tr></thead><tbody id="salesTableBody"></tbody></table></div></div></div></div>
</div>

      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/apiClient.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
