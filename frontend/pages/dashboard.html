<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <title>Dashboard | Bolt & Hammer</title>
</head>
<body data-page="dashboard">
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <main class="main-content">
      <div id="topbar"></div>
      <div class="content-area">
        <div id="pageAlert"></div>
        
<div class="row g-3 mb-4">
  <div class="col-md-6 col-xl-2"><div class="card metric-card"><div class="card-body"><div class="metric-icon mb-3"><i class="bi bi-cash-coin"></i></div><div class="small-muted">Ventas de hoy</div><div id="metricToday" class="h4 fw-bold mb-0">S/ 0.00</div></div></div></div>
  <div class="col-md-6 col-xl-2"><div class="card metric-card"><div class="card-body"><div class="metric-icon mb-3"><i class="bi bi-boxes"></i></div><div class="small-muted">Stock total</div><div id="metricStock" class="h4 fw-bold mb-0">0</div></div></div></div>
  <div class="col-md-6 col-xl-2"><div class="card metric-card"><div class="card-body"><div class="metric-icon mb-3"><i class="bi bi-exclamation-triangle"></i></div><div class="small-muted">Stock bajo</div><div id="metricLow" class="h4 fw-bold mb-0">0</div></div></div></div>
  <div class="col-md-6 col-xl-2"><div class="card metric-card"><div class="card-body"><div class="metric-icon mb-3"><i class="bi bi-people"></i></div><div class="small-muted">Clientes</div><div id="metricClients" class="h4 fw-bold mb-0">0</div></div></div></div>
  <div class="col-md-6 col-xl-2"><div class="card metric-card"><div class="card-body"><div class="metric-icon mb-3"><i class="bi bi-receipt"></i></div><div class="small-muted">Ventas</div><div id="metricSales" class="h4 fw-bold mb-0">0</div></div></div></div>
</div>
<div class="row g-3">
  <div class="col-lg-6"><div class="card"><div class="card-body"><h5 class="fw-bold mb-3">Productos con stock bajo</h5><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Codigo</th><th>Producto</th><th>Categoria</th><th>Stock</th><th>Min.</th></tr></thead><tbody id="lowStockBody"></tbody></table></div></div></div></div>
  <div class="col-lg-6"><div class="card"><div class="card-body"><h5 class="fw-bold mb-3">Ventas recientes</h5><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Fecha</th><th>Cliente</th><th>Vendedor</th><th>Pago</th><th>Total</th></tr></thead><tbody id="recentSalesBody"></tbody></table></div></div></div></div>
</div>

      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/apiClient.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
