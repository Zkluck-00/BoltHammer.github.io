<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Bolt & Hammer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="login">
  <section class="login-wrapper">
    <div class="card login-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="display-6 mb-2">🔩</div>
          <h1 class="h3 fw-bold mb-1">Bolt & Hammer</h1>
          <p class="text-muted mb-0">Sistema de inventario y ventas</p>
        </div>
        <div id="loginAlert"></div>
        <form id="loginForm" class="row g-3">
          <div class="col-12">
            <label class="form-label">Usuario</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input id="username" class="form-control" placeholder="admin o vendedor" required>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input id="password" type="password" class="form-control" placeholder="Ingresa tu contraseña" required>
            </div>
          </div>
          <div class="col-12 d-grid mt-2"><button class="btn btn-primary btn-lg">Ingresar</button></div>
          <div class="col-12">
          </div>
        </form>
      </div>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/apiClient.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
